name: CI

on:
  push:
    branches: [main, jira-auto]
  pull_request:
    branches: [main, jira-auto]

jobs:
  test:
    name: Bats tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run tests
        run: ./run_tests.sh

  # jq 1.6 is the supported floor (#296), and it rejects programs 1.7+ accept:
  # `$label` (a keyword in 1.6) broke every jira/notion snapshot while this
  # matrix, on the runners' newer jq, stayed green. So the suite runs once more
  # with the official 1.6 binary first on PATH.
  test-jq16:
    name: Bats tests (jq 1.6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The sha256 is jqlang's own, from sig/v1.6/sha256sum.txt in the jq repo
      # (the 2018 release assets carry no GitHub digest).
      - name: Install jq 1.6
        run: |
          mkdir -p "$RUNNER_TEMP/jq16"
          curl -fsSL -o "$RUNNER_TEMP/jq16/jq" \
            https://github.com/jqlang/jq/releases/download/jq-1.6/jq-linux64
          echo "af986793a515d500ab2d35f8d2aecd656e764504b789b66d7e1a0b727a124c44  $RUNNER_TEMP/jq16/jq" \
            | sha256sum -c -
          chmod +x "$RUNNER_TEMP/jq16/jq"
          echo "$RUNNER_TEMP/jq16" >> "$GITHUB_PATH"

      - name: Run tests
        run: |
          test "$(jq --version)" = jq-1.6
          ./run_tests.sh

  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        run: |
          shellcheck -x \
            install.sh task-init run_tests.sh \
            bin/* lib/*.sh lib/trackers/*.sh lib/agents/*.sh tools/*.sh \
            tests/helpers/*.bash tests/setup_suite.bash \
            */install.sh */bin/*

  drift-check:
    name: Loadout drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check loadout drift
        run: bash tools/check-drift.sh

  # The task-monitor front end (#276). Stable on both OSes; the MSRV job keeps
  # `rust-version` in monitor/Cargo.toml honest (ratatui 0.30 needs 1.88).
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: monitor
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: monitor

      - name: Format
        run: cargo fmt --check

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  rust-msrv:
    name: Rust MSRV (1.88)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitor
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: monitor

      - name: Build and test on the declared rust-version
        run: |
          grep -qx 'rust-version = "1.88"' Cargo.toml
          cargo build --locked
          cargo test --locked
